# Typed prose for the generated eval config (eval-initiative.yaml). The structure, the shared
# judges and every check live in eval/config/skeleton.yaml; identity, dirs, score fields and
# thresholds come from type.yaml. Schema: types/_schema/eval-fragment.schema.json.
# Regenerate with: python3 scripts/generate_eval_config.py
schema_version: 1
entity_long: Initiative
execution:
  skill: initiative-speedrun
  create_skill: initiative-create
  timeout_note: 2 hours 15 minutes
dataset:
  prompt: Engineering objective (1-3 sentences)
  clarifying_context: |
    - clarifying_context (string): Informal prose capturing motivation,
      constraints, team context, scope, timeline, success criteria
inputs:
  questions_context: |
    clarifying questions during initiative-create (objective, problem,
    scope, parent outcome).
  questions_answer: |
    Use the 'clarifying_context' field for scope, constraints,
    and supporting details.
    Use the 'prompt' field for the core objective.
outputs:
  task_fields: |
    initiative_id, title, priority (Blocker/Critical/Major/Normal/Minor),
    status (Draft/Ready/Submitted/Archived),
    parent_key (for RHAISTRAT linkage or split children), original_labels.
  task_sections: |
    Body sections: Objective, Problem Statement, Scope.
  review_files: |
    {ID}-feasibility.md: Technical feasibility assessment with
      architecture context analysis, blockers, scope assessment.
    {ID}-alignment.md: Strategic alignment assessment against
      RHAISTRAT parent Outcome (if applicable).
  review_body: |
    Body of review: Assessor Feedback, Technical Feasibility,
    Strategic Alignment, Execution Considerations, Revision History.
architecture_context:
  # Initiatives may legitimately declare the architecture context irrelevant (design §4.5:
  # the not_relevant carve-out, an explicit fragment entry rather than a silent config drift).
  not_relevant_pattern: "architecture context (was |is )?(not |un)relevant|no relevant architecture context|outside the scope of.*architecture context"
  not_relevant_note: |
    A review that declares the context not relevant — which Initiatives may
    legitimately do — counts as grounded instead of failing.
quality:
  criteria: |
    - WHAT: Have a clear objective — specific, measurable, achievable
    - WHY: Present an evidence-based problem statement — concrete pain points,
      data-driven justification
    - Scope: Define explicit scope boundaries — clear inclusions and exclusions
      (prose boundaries are fine, formal In/Out sections are not required)
    - Open to HOW: Not mandate specific technology choices when alternatives
      exist — referencing technologies dictated by integration context is fine
      (e.g., "must support vLLM" when vLLM is the existing runtime),
      and listing technologies as suggestions or illustrations is fine
      (e.g., "could use Redis or similar"), but prescribing technology
      choices as decisions when alternatives exist is not
      (e.g., "implement using Redis" when the choice is open)
    - Right-sized: Represent a single coherent effort — not bundle independent
      workstreams that could be planned and executed by different teams
  extra_checks: |
    Also check feasibility and alignment verdicts — are they accurate
    given the Initiative's content and any architecture context used?
revision:
  assessments: |
    **Revision quality**: Did revisions genuinely improve the Initiative?
    Clarified objectives, strengthened evidence, clarified scope boundaries?
    Or just cosmetic/lateral changes?

    **Content fidelity**: Was important content preserved?
    Context, constraints, and scope intact?
    Or was critical content lost during revision?

    **Scope clarity**: When scope was clarified, was the intent preserved
    while making boundaries explicit? Or was scope simply deleted?

    **Reframing quality**: When prescriptive implementation details were
    present (mandating specific technology choices where alternatives exist),
    was the content reframed to preserve the underlying need using suggestive
    or needs-based language? Or was prescriptive content simply deleted
    without reframing the intent? Note: technology references dictated by
    integration context (e.g., "must support vLLM" when vLLM is the existing
    runtime) should NOT be reframed — they are legitimate constraints, not
    prescriptive choices.
threshold_notes:
  revision_coverage: |
    with 20 cases of which 6 are tagged revision-expected (case-007, case-013
    and case-017 to case-020, each carrying a gap the create step cannot
    repair: a circular WHY, a dictated technology stack, or no boundaries),
    5 of 6 revised leaves 1 failure -> 19/20 = 0.95 (pass); 4 of 6 revised
    leaves 2 failures -> 18/20 = 0.90 (fail). The 1-failure slack is shared
    with any case without a review file. Calibrated on 2026-09-18 (#193): all
    six failed first review on the targeted criterion and were revised (007
    HOW 0, 013 WHY 0, 017 WHY 0, 018 HOW 0, 019 HOW 0, 020 WHY 0). Until 2026-09-16
    the dataset had no tagged case and the gate passed only through the
    run-level rule on incidental revisions (5 of 16 on 2026-09-04, 1 of 16 on
    2026-09-15 — always case-012, whose sparse draft failed first review
    while the pipeline dropped the requester context); once #188 forwarded
    that context the same case drafted at 7, the run revised nothing and
    every case scored 0.0. A multi-item run with zero revisions still fails
    every case on any dataset. Single-item runs (Harbor tasks,
    execution.mode: case) skip the run-level check and are decided by the
    tag alone. Untagged cases otherwise always pass.

# GitHub Actions workflow to add to opendatahub-io/rfe-creator.
#
# Place this file at: .github/workflows/rfe-creator-eval.yml
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   GITLAB_TRIGGER_TOKEN  — GitLab pipeline trigger token
#   GITLAB_TRIGGER_URL    — https://gitlab.com/api/v4/projects/<project-id>/trigger/pipeline
#
# Manually triggered by a maintainer from the Actions tab. Enter the PR
# number to evaluate. Only users with write access can run this workflow.
#
# The GitLab pipeline posts eval results back to the PR as a comment.
# GITHUB_TOKEN is used by the GitLab pipeline for posting — it is configured
# as a GitLab CI/CD variable and is NOT passed into the OpenShell sandbox.

name: Eval

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to evaluate"
        required: true
        type: number
      eval_config:
        description: "Eval config to run"
        type: choice
        default: eval.yaml
        options:
          - eval.yaml
          - eval-initiative.yaml
      quick_mode:
        description: "Quick mode: 2 cases only (~$5 vs ~$50)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  trigger-eval:
    name: Trigger GitLab eval pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PR details
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env, not `${{ }}` in the script: a workflow_dispatch input is
          # expanded into the shell before bash sees it, and `type: number` is a
          # UI hint rather than a constraint the API enforces. The step below
          # already reads its values this way.
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          PR_JSON=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
          echo "sha=$(echo "$PR_JSON" | jq -r '.head.sha')" >> "$GITHUB_OUTPUT"
          echo "ref=$(echo "$PR_JSON" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"

      - name: Trigger rfe-creator-eval on GitLab
        env:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          GITLAB_TRIGGER_URL: ${{ secrets.GITLAB_TRIGGER_URL }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
          PR_REF: ${{ steps.pr.outputs.ref }}
          REPO: ${{ github.repository }}
          EVAL_CONFIG: ${{ inputs.eval_config }}
          QUICK_MODE: ${{ inputs.quick_mode }}
        run: |
          curl --fail-with-body \
            --request POST \
            --form-string "token=${GITLAB_TRIGGER_TOKEN}" \
            --form-string "ref=main" \
            --form-string "variables[GITHUB_PR_NUMBER]=${PR_NUMBER}" \
            --form-string "variables[GITHUB_SHA]=${PR_SHA}" \
            --form-string "variables[GITHUB_HEAD_REF]=${PR_REF}" \
            --form-string "variables[GITHUB_REPO]=${REPO}" \
            --form-string "variables[EVAL_CONFIG]=${EVAL_CONFIG}" \
            --form-string "variables[QUICK_MODE]=${QUICK_MODE}" \
            "${GITLAB_TRIGGER_URL}"

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Run skillsaw
      uses: stbenjam/skillsaw@c2592a0fe1a86345da838fa16fcda6b55f495178 # v0.11.2
      with:
        strict: 'true'

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.13'

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        pip install -r requirements-dev.txt

    - name: Run ruff check
      run: ruff check .

    - name: Run ruff format check
      run: ruff format --check --diff .

    - name: Validate work item type descriptors
      run: python3 scripts/validate_types.py

    # eval.yaml / eval-initiative.yaml are generated (design section 4.5): a hand edit or a
    # skeleton/fragment change without regeneration fails here with the diff.
    - name: Check the generated eval configs are in sync
      run: python3 scripts/generate_eval_config.py --check

    - name: Lint literal key-prefix predicates
      run: python3 scripts/lint_prefix_predicates.py

    - name: Run shellcheck
      run: find . -name '*.sh' -type f -exec shellcheck {} +

    - name: Run tests
      run: python3 -m pytest tests/ -v -rs -k "not integration"

    # The Jira write path (submit.py, split_submit.py) reads the type registry; the
    # jira-emulator suites are its equivalence proof and gate that adoption
    # (design work-item-types-unified.md section 10 item 2). jira-emulator comes from
    # requirements-dev.txt; the server runs in-process on a free local port.
    - name: Run emulator integration tests
      run: python3 -m pytest tests/ -v -rs -k integration

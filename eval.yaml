  frontmatter_valid:
    min_pass_rate: 1.0
  run_report_exists:
    min_pass_rate: 1.0
  recommendation_consistency:
    min_pass_rate: 1.0
  revision_flag_consistency:
    min_pass_rate: 1.0
  pipeline_flow:
    min_pass_rate: 1.0
  architecture_context_used:
    min_pass_rate: 1.0
  rfe_quality:
    min_mean: 3.5
  revision_quality:
    min_mean: 3.5
